name: Build

on:
  workflow_dispatch: # allows for manual triggering
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt 
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest tests/ -v

  build-macos-arm:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh
      - name: Zip the .app bundle
        run: |
          cd src
          zip -r AKAISDS-macos-arm.zip AKAISDS.app
      - uses: actions/upload-artifact@v4
        with:
          name: AKAISDS-macos-arm
          path: src/AKAISDS-macos-arm.zip

  build-macos-intel:
    needs: test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh
      - name: Zip the .app bundle
        run: |
          cd src
          zip -r AKAISDS-macos-intel.zip AKAISDS.app
      - uses: actions/upload-artifact@v4
        with:
          name: AKAISDS-macos-intel
          path: src/AKAISDS-macos-intel.zip

  build-linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh
      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp -r src/AKAISDS.dist/* AppDir/usr/bin 

          wget -O linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          LDAI_OUTPUT=AKAISDS-linux.AppImage ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable AppDir/usr/bin/main.bin \
            --desktop-file assets/linux/AKAISDS.desktop \
            --icon-file assets/icon/icon_512x512.png \
            --output appimage

          ls -la *.AppImage
      - name: Zip the AppImage
        run: zip AKAISDS-linux.zip AKAISDS-linux.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: AKAISDS-linux
          path: src/AKAISDS-linux.zip

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: .\scripts\build_windows.ps1
      - name: Build installer
        run: |
          choco install innosetup -y
          $VersionLine = Get-Content src\ui\_version.py
          $Version = ($VersionLine -replace '.*"(.+)".*', '$1')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$Version assets\windows\AKAISDS.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AKAISDS-windows
          path: AKAISDS-Setup.exe

  release:
    needs: [build-macos-arm, build-macos-intel, build-linux, build-windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/**/*
