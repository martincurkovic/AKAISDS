name: Build

on:
  workflow_dispatch: # allows for manual triggering
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-macos-arm:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync
      - name: Build
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh  # also builds AKAISDS-macos-{arm,intel}.dmg at the repo root
      - uses: actions/upload-artifact@v4
        with:
          name: AKAISDS-macos-arm
          path: AKAISDS-macos-arm.dmg

  build-macos-intel:
    needs: test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync
      - name: Build
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh  # also builds AKAISDS-macos-{arm,intel}.dmg at the repo root
      - uses: actions/upload-artifact@v4
        with:
          name: AKAISDS-macos-intel
          path: AKAISDS-macos-intel.dmg

  # The macOS 12 build: Qt 6.8, see dev_docs/macos12-support-handoff.md. continue-on-error while it is new, so a failure here can't stop the
  # ordinary release (the release job still attaches whichever DMGs were built). check_minos.sh fails the job if any file needs macOS > 12.
  build-macos-legacy:
    needs: test
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm, runner: macos-15 }
          - { arch: intel, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: |
          chmod +x scripts/build_macos.sh scripts/check_minos.sh
          AKAISDS_FLAVOR=legacy ./scripts/build_macos.sh  # syncs the qt-legacy environment itself, and builds AKAISDS-macos-{arm,intel}-legacy.dmg
      - name: Check nothing needs a newer macOS than 12
        run: ./scripts/check_minos.sh 12.0
      - uses: actions/upload-artifact@v4
        with:
          name: AKAISDS-macos-${{ matrix.arch }}-legacy
          path: AKAISDS-macos-${{ matrix.arch }}-legacy.dmg

  build-linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential qt6-qpa-plugins libegl1 libgl1 libfontconfig1 libnss3 libnss3 libasound2t64 libpulse0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcomposite1 libxdamage1 libxi6 libxtst6
      - name: Build
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh
      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp -r src/AKAISDS.dist/* AppDir/usr/bin
          cp assets/linux/AKAISDS.desktop AppDir/AKAISDS.desktop
          cp assets/icon/icon_512x512.png AppDir/icon_512x512.png
          ln -s icon_512x512.png AppDir/.DirIcon
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/main.bin" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

          wget -O appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir AKAISDS-linux.AppImage

          ls -la *.AppImage
      - name: Zip the AppImage
        run: zip AKAISDS-linux.zip AKAISDS-linux.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: AKAISDS-linux
          path: AKAISDS-linux.zip

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync
      - name: Build
        run: .\scripts\build_windows.ps1
      - name: Build installer
        run: |
          choco install innosetup -y
          $VersionLine = Get-Content src\ui\_version.py
          $Version = ($VersionLine -replace '.*"(.+)".*', '$1')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$Version assets\windows\AKAISDS.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AKAISDS-windows
          path: AKAISDS-Setup.exe

  release:
    needs: [build-macos-arm, build-macos-intel, build-macos-legacy, build-linux, build-windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/**/*
          draft: true # comment this out if u want the release to be auto-published
