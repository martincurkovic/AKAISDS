name: Build

on:
  workflow_dispatch:   # lets you trigger this manually from GitHub's website

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh
      - name: Zip the .app bundle
        run: | 
          cd src
          zip -r AKAISDS-macos-ARM.zip AKAISDS.app 
      - uses: actions/upload-artifact@v4
        with:
          name: AKAISDS-macos
          path: src/AKAISDS-macos-ARM.zip

  build-macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh
      - name: Zip the .app bundle
        run: | 
          cd src
          zip -r AKAISDS-macos-intel.zip AKAISDS.app 
      - uses: actions/upload-artifact@v4
        with:
          name: AKAISDS-macos
          path: src/AKAISDS-macos-intel.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AKAISDS-linux
          path: src/AKAISDS.bin

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: .\scripts\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AKAISDS-windows
          path: src/AKAISDS.exe
