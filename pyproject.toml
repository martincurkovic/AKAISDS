[project]
name = "AKAISDS"
version = "0.0.0" # placeholder, real value derived from git tags in build stage
description = "A cross-platform MIDI Sample Dump Standard transfer tool for Akai and generic SDS-compatible samplers. Built with PySide6 (Qt), Mido, python-rtmidi, soundfile and Nuitka."
authors = [{ name = "Martin Curkovic", email = "martincurkovic@icloud.com" }]
requires-python = ">=3.12"
dependencies = [
    "imageio>=2.37.4",
    "mido>=1.3.3",
    "Nuitka==4.1.3",
    "python-rtmidi>=1.5.8",
    "soundfile>=0.14.0",
    "s3ked",
    "miniaudio>=1.71",
    "certifi>=2026.7.22",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "numpy>=2.5.1",
    "dmgbuild>=1.6.7",
]
# Exactly one of these is installed. qt-current is the default (plain `uv sync`); qt-legacy is the macOS 12 build (dev_docs/macos12-support-handoff.md):
#   uv sync --no-group qt-current --group qt-legacy
qt-current = ["PySide6==6.11.2"]
qt-legacy = ["PySide6==6.8.3"]

[tool.uv]
default-groups = ["dev", "qt-current"]
conflicts = [[{ group = "qt-current" }, { group = "qt-legacy" }]]

[tool.pytest.ini_options]
# a test stuck for this long dumps every thread's stack (pytest's faulthandler), instead of the run hanging silently: one full run deadlocked once (see TESTING.md)
faulthandler_timeout = 300

[tool.uv.sources]
s3ked = { git = "https://github.com/lentferj/s3ked.git", rev = "665e855c45da9fe8102328961503f3282311862a" }
